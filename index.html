<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رجيم</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
body { background:#fff; padding:20px; padding-bottom:100px; }
.top { text-align:right; margin-bottom:20px; }
.top h1 { font-size:32px; }
.top p { color:#888; margin-top:5px; }
.card { border-radius:24px; padding:22px; margin-bottom:18px; display:flex; align-items:center; gap:15px; }
.green { background:#DFF5E6; }
.orange { background:#FFE8D9; }
.icon { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; }
.green .icon { background:#BDE0FF; }
.orange .icon { background:#FFD6B5; }
.card-text { flex:1; }
.card-text h2 { font-size:22px; }
.card-text .big { font-size:56px; font-weight:900; line-height:1; margin:5px 0; }
.card-text small { color:#666; }
.bar { height:8px; background:rgba(0,0,0,0.08); border-radius:99px; margin-top:10px; overflow:hidden; }
.fill { height:100%; border-radius:99px; }
.green .fill { background:#4A90E2; width:25%; }
.orange .fill { background:#FF9A5A; width:10%; }
.btn { width:100%; padding:12px; border:none; border-radius:99px; font-size:16px; cursor:pointer; margin-top:5px; }
.btn-blue { background:#4A90E2; color:#fff; }
.btn-orange { background:#FF9A5A; color:#fff; }
.meals { margin-top:25px; }
.meals h3 { margin-bottom:12px; }
.meal { background:#F7F7F7; padding:14px; border-radius:16px; display:flex; justify-content:space-between; margin-bottom:10px; }
.bottom { position:fixed; bottom:0; right:0; left:0; background:#fff; display:flex; justify-content:space-around; padding:12px 0; border-top:1px solid #eee; }
.bottom div { text-align:center; font-size:13px; color:#999; }
.bottom .active { color:#5FC79A; }
</style>
</head>
<body>

<div class="top">
  <h1>مرحباً 👋</h1>
  <p>اليوم، تتبع صحتك</p>
</div>

<div class="card green">
  <div class="icon">💧</div>
  <div class="card-text">
    <h2>الماء</h2>
    <div class="big"><span id="water">2</span></div>
    <small>لتر من 2.5 لتر</small>
    <div class="bar"><div class="fill" id="waterBar"></div></div>
    <button class="btn btn-blue" onclick="addWater()" style="margin-top:12px">+ كأس</button>
  </div>
</div>

<div class="card orange">
  <div class="icon">🔥</div>
  <div class="card-text">
    <h2>السعرات الحرارية</h2>
    <div class="big" style="color:#B34A00"><span id="cal">200</span></div>
    <small>سعرة من 2000 سعرة</small>
    <div class="bar"><div class="fill" id="calBar"></div></div>
    <button class="btn btn-orange" onclick="addCal()" style="margin-top:12px">+ 100</button>
  </div>
</div>

<div class="meals">
  <h3>وجباتي اليوم</h3>
  <div id="list">
    <div class="meal"><span>🍳 فطور - بيض و آتاي</span><b>200</b></div>
  </div>
  <button class="btn" style="background:#5FC79A;color:#fff" onclick="addMeal()">+ إضافة وجبة</button>
</div>

<div class="bottom">
  <div class="active">🏠<br>الرئيسية</div>
  <div>📋
